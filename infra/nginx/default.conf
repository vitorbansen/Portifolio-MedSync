server {
    listen 80;
    server_name _;

    # DNS embutido do Docker. Sem isso, o Nginx resolve "backend"/"frontend"
    # uma unica vez ao iniciar e fica com o IP antigo (502) quando o deploy
    # recria esses containers sem reiniciar o Nginx.
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 1m;

    # Desafio HTTP-01 do Let's Encrypt (certbot escreve aqui via --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        set $backend_upstream http://backend:3333;
        # Sem path apos a variavel: com variavel, o Nginx NAO faz a substituicao
        # automatica de prefixo: qualquer path fixo aqui (ex.: "/api/") seria
        # enviado literalmente pro backend, ignorando o resto da URL recebida.
        # Sem path, ele repassa a URI original (/api/medicos, /api/auth/login etc).
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
