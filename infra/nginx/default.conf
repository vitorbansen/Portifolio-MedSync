server {
    listen 80;
    server_name _;

    # DNS embutido do Docker. Sem isso, o Nginx resolve "backend"/"frontend"
    # uma unica vez ao iniciar e fica com o IP antigo (502) quando o deploy
    # recria esses containers sem reiniciar o Nginx.
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 1m;

    location /api/ {
        set $backend_upstream http://backend:3333;
        proxy_pass $backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
